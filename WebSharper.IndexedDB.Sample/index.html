<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebSharper IndexedDB Demo</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%234f46e5'/%3E%3Cellipse cx='8' cy='4.5' rx='4.5' ry='2' fill='white'/%3E%3Cpath d='M3.5 4.5v7c0 1.1 2 2 4.5 2s4.5-.9 4.5-2v-7' fill='none' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" type="text/css" href="Content/WebSharper.IndexedDB.Sample.css" />
    <link rel="stylesheet" type="text/css" href="site.css" />
    <script type="module" src="Content/WebSharper.IndexedDB.Sample.head.js"></script>
</head>
<body>
    <main class="page">
        <header class="hero">
            <h1>IndexedDB Demo</h1>
            <p class="lede">
                Open a database, add records, query them, and delete the database with the
                <a href="https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API" target="_blank" rel="noreferrer">IndexedDB API</a>.
            </p>
        </header>

        <section class="card">
            <h2>Progress</h2>
            <p class="hint">
                The sample opens <code>db1</code>, creates a <code>store1</code> object store, inserts a few people,
                queries them with <code>getAll</code>, and deletes the database.
            </p>
            <p class="status" role="status">${status}</p>
            <div class="progress" ws-hole="progress"></div>
        </section>
    </main>
    <script type="module" src="Content/WebSharper.IndexedDB.Sample.min.js"></script>
</body>
</html>
